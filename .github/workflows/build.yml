name: Build & Performance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Generate bundle analysis
        run: npm run analyze
      
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(stat -c%s client/dist/assets/js/main-*.js 2>/dev/null | head -1)
          MAX_SIZE=$((400 * 1024))
          if [ -z "$BUNDLE_SIZE" ]; then
            echo "❌ Could not find main bundle"
            exit 1
          fi
          if [ $BUNDLE_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle size ($BUNDLE_SIZE bytes) exceeds limit ($MAX_SIZE bytes)"
            exit 1
          fi
          echo "✅ Bundle size OK ($BUNDLE_SIZE bytes)"
      
      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bundle-stats
          path: client/dist/stats.html
