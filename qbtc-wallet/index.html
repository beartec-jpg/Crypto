<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/qbtc-wallet/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0891b2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="qBTC Wallet" />
    <link rel="apple-touch-icon" href="/qbtc-wallet/icons/icon-192x192.png" />
    <title>qBTC Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Capture install prompt BEFORE React mounts — event fires very early
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new Event('installpromptready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
